<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Weather App</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f9; display: flex; justify-content: center; padding-top: 50px; }
        .card { background: white; padding: 2rem; border-radius: 15px; shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        .temp { font-size: 3rem; font-weight: bold; color: #0070f3; }
        .info { color: #666; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="location">서울 날씨</h2>
        <div id="weather">
            <p>데이터 로딩 중...</p>
        </div>
    </div>

    <script>
        async function getWeatherData() {
            // 현재 날짜와 시간 계산 (기상청 기준에 맞춰 가공 필요)
            const now = new Date();
            const baseDate = now.toISOString().slice(0, 10).replace(/-/g, ""); 
            const baseTime = "0500"; // 예시: 새벽 5시 발표 데이터

            try {
                // 직접 API를 호출하지 않고, 내 서버(Vercel Function)로 요청을 보냄
                const response = await fetch(`/api/weather?nx=55&ny=127&baseDate=${baseDate}&baseTime=${baseTime}`);
                const data = await response.json();
                
                const items = data.response.body.items.item;
                const temp = items.find(i => i.category === 'TMP').fcstValue;
                const humidity = items.find(i => i.category === 'REH').fcstValue;

                document.getElementById('weather').innerHTML = `
                    <div class="temp">${temp}°C</div>
                    <div class="info">습도: ${humidity}%</div>
                `;
            } catch (error) {
                document.getElementById('weather').innerHTML = "<p>날씨를 불러오지 못했습니다.</p>";
            }
        }

        getWeatherData();
    </script>
</body>
</html>
